apiVersion: v1
kind: Service
metadata:
  name: {{ include "video-backend-chart.fullname" . }}
  labels:
    {{- include "video-backend-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      nodePort: {{ .Values.service.nodePort }}
  selector:
    app: {{ include "video-backend-chart.fullname" . }}