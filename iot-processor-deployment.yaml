apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-edge-processor
  namespace: iot-slice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-processor
  template:
    metadata:
      labels:
        app: iot-processor
    spec:
      containers:
        - name: iot-processor
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "[$(date)] Processing edge data batch..."
                sleep 5
              done
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"