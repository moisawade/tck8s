apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: video-backend-hpa
  namespace: realtime-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: video-backend-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 10