apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ran-controller-resource-reader-binding
  namespace: ran-services
subjects:
  - kind: ServiceAccount
    name: ran-controller-sa
    namespace: ran-services
roleRef:
  kind: Role
  name: ran-resource-reader-role
  apiGroup: rbac.authorization.k8s.io